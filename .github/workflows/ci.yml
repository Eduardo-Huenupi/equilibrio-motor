name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas-y-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: make test
      - name: Evals (fallan si la calidad baja)
        run: make evals
      - name: Guardar reporte de evals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-evals
          path: evals/reportes/ultimo.md
